<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Breaker</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
        }

        .game-wrap {
            width: min(94vw, 840px);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
            font-weight: 700;
        }

        canvas {
            width: 100%;
            aspect-ratio: 4 / 3;
            display: block;
            background: #141433;
            border: 3px solid #334155;
        }

        .bar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 10px;
            color: #dbeafe;
            font-size: 15px;
        }

        button {
            border: 0;
            padding: 8px 12px;
            background: #38bdf8;
            color: #082f49;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #7dd3fc;
        }
    </style>
</head>
<body>
    <main class="game-wrap">
        <h1>Brick Breaker</h1>
        <canvas id="game" width="800" height="600"></canvas>
        <div class="bar">
            <span>Move: mouse, arrow keys, or A/D</span>
            <button id="restart">Restart</button>
        </div>
    </main>

    <script>
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const restartButton = document.getElementById("restart");

        const keys = {
            left: false,
            right: false
        };

        let paddle;
        let balls;
        let bricks;
        let powerUps;
        let score;
        let lives;
        let gameOver;
        let won;
        let usingMouse;
        let lastTime;

        const powerTypes = ["wide", "multi", "slow", "life"];
        const colors = ["#ef4444", "#f97316", "#facc15", "#22c55e", "#3b82f6", "#6366f1", "#a855f7", "#ec4899"];

        function resetGame() {
            paddle = {
                x: 350,
                y: 560,
                width: 100,
                height: 15,
                speed: 430
            };
            balls = [
                { x: 400, y: 540, radius: 10, vx: 200, vy: -250, active: true }
            ];
            bricks = [];
            powerUps = [];
            score = 0;
            lives = 3;
            gameOver = false;
            won = false;
            usingMouse = true;
            lastTime = performance.now();
            createBricks();
        }

        function createBricks() {
            const rows = 8;
            const cols = 10;
            const brickWidth = 60;
            const brickHeight = 20;
            const spacing = 5;
            const offsetX = 80;
            const offsetY = 50;

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    bricks.push({
                        x: offsetX + col * (brickWidth + spacing),
                        y: offsetY + row * (brickHeight + spacing),
                        width: brickWidth,
                        height: brickHeight,
                        hp: row < 2 ? 2 : 1,
                        maxHp: row < 2 ? 2 : 1,
                        color: colors[row % colors.length],
                        destroyed: false
                    });
                }
            }
        }

        function update(deltaTime) {
            if (gameOver || won) {
                return;
            }

            if (!usingMouse) {
                if (keys.left) {
                    paddle.x -= paddle.speed * deltaTime;
                }
                if (keys.right) {
                    paddle.x += paddle.speed * deltaTime;
                }
                keepPaddleInBounds();
            }

            for (const ball of balls) {
                ball.x += ball.vx * deltaTime;
                ball.y += ball.vy * deltaTime;

                if (ball.x - ball.radius < 0) {
                    ball.x = ball.radius;
                    ball.vx *= -1;
                }
                if (ball.x + ball.radius > canvas.width) {
                    ball.x = canvas.width - ball.radius;
                    ball.vx *= -1;
                }
                if (ball.y - ball.radius < 0) {
                    ball.y = ball.radius;
                    ball.vy *= -1;
                }
                if (ball.y - ball.radius > canvas.height) {
                    ball.active = false;
                }

                checkPaddleHit(ball);
                checkBrickHits(ball);
            }

            balls = balls.filter(ball => ball.active);
            if (balls.length === 0) {
                lives--;
                if (lives <= 0) {
                    gameOver = true;
                } else {
                    balls.push({ x: 400, y: 540, radius: 10, vx: 200, vy: -250, active: true });
                }
            }

            for (const powerUp of powerUps) {
                powerUp.y += powerUp.speed * deltaTime;
                if (touchesPaddle(powerUp)) {
                    applyPowerUp(powerUp.type);
                    powerUp.collected = true;
                }
            }
            powerUps = powerUps.filter(powerUp => !powerUp.collected && powerUp.y < canvas.height);

            won = bricks.every(brick => brick.destroyed);
        }

        function checkPaddleHit(ball) {
            const bottom = ball.y + ball.radius;
            const insideX = ball.x >= paddle.x && ball.x <= paddle.x + paddle.width;
            const insideY = bottom >= paddle.y && bottom <= paddle.y + paddle.height + 10;

            if (ball.vy > 0 && insideX && insideY) {
                const hitPos = (ball.x - paddle.x) / paddle.width;
                const angle = (hitPos - 0.5) * Math.PI * 0.7;
                const speed = Math.hypot(ball.vx, ball.vy);
                ball.vx = speed * Math.sin(angle);
                ball.vy = -speed * Math.cos(angle);
                ball.y = paddle.y - ball.radius;
            }
        }

        function checkBrickHits(ball) {
            for (const brick of bricks) {
                if (brick.destroyed) {
                    continue;
                }

                if (ballIntersectsBrick(ball, brick)) {
                    brick.hp--;
                    if (brick.hp <= 0) {
                        brick.destroyed = true;
                        score += 10;
                        maybeDropPowerUp(brick);
                    }
                    ball.vy *= -1;
                    break;
                }
            }
        }

        function ballIntersectsBrick(ball, brick) {
            const closestX = Math.max(brick.x, Math.min(ball.x, brick.x + brick.width));
            const closestY = Math.max(brick.y, Math.min(ball.y, brick.y + brick.height));
            const dx = ball.x - closestX;
            const dy = ball.y - closestY;
            return dx * dx + dy * dy < ball.radius * ball.radius;
        }

        function maybeDropPowerUp(brick) {
            if (Math.random() > 0.15) {
                return;
            }

            const type = powerTypes[Math.floor(Math.random() * powerTypes.length)];
            powerUps.push({
                x: brick.x + brick.width / 2 - 10,
                y: brick.y + brick.height / 2 - 10,
                width: 20,
                height: 20,
                speed: 120,
                type,
                collected: false
            });
        }

        function applyPowerUp(type) {
            if (type === "wide") {
                paddle.width = Math.min(200, paddle.width + 30);
                keepPaddleInBounds();
            }
            if (type === "life") {
                lives++;
            }
            if (type === "slow") {
                for (const ball of balls) {
                    const speed = Math.max(120, Math.hypot(ball.vx, ball.vy) * 0.7);
                    const angle = Math.atan2(ball.vy, ball.vx);
                    ball.vx = Math.cos(angle) * speed;
                    ball.vy = Math.sin(angle) * speed;
                }
            }
            if (type === "multi") {
                balls.push(
                    { x: paddle.x + paddle.width / 2 - 20, y: 540, radius: 10, vx: -180, vy: -230, active: true },
                    { x: paddle.x + paddle.width / 2 + 20, y: 540, radius: 10, vx: 180, vy: -230, active: true }
                );
            }
        }

        function touchesPaddle(powerUp) {
            return powerUp.x + powerUp.width > paddle.x &&
                powerUp.x < paddle.x + paddle.width &&
                powerUp.y + powerUp.height > paddle.y &&
                powerUp.y < paddle.y + paddle.height;
        }

        function keepPaddleInBounds() {
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));
        }

        function draw() {
            ctx.fillStyle = "#141433";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (const brick of bricks) {
                if (brick.destroyed) {
                    continue;
                }
                ctx.fillStyle = brick.color;
                ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                ctx.fillStyle = "rgba(255, 255, 255, 0.22)";
                ctx.fillRect(brick.x + 2, brick.y + 2, brick.width - 4, brick.height / 2 - 2);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
                ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);

                if (brick.maxHp > 1) {
                    ctx.fillStyle = "white";
                    ctx.font = "12px Arial";
                    ctx.fillText(brick.hp, brick.x + brick.width / 2 - 3, brick.y + 14);
                }
            }

            for (const powerUp of powerUps) {
                ctx.fillStyle = powerColor(powerUp.type);
                ctx.fillRect(powerUp.x, powerUp.y, powerUp.width, powerUp.height);
                ctx.fillStyle = "white";
                ctx.font = "bold 12px Arial";
                ctx.fillText(powerSymbol(powerUp.type), powerUp.x + 6, powerUp.y + 14);
            }

            for (const ball of balls) {
                ctx.fillStyle = "rgba(255, 100, 100, 0.18)";
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius + 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#ff5050";
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = "#3c3cb4";
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.fillStyle = "#7878ff";
            ctx.fillRect(paddle.x + 6, paddle.y + 3, paddle.width - 12, paddle.height - 6);

            drawHud();

            if (gameOver) {
                drawMessage("GAME OVER", "#ef4444", "Press R or click Restart");
            }
            if (won) {
                drawMessage("YOU WIN", "#facc15", "Press R or click Restart");
            }
        }

        function drawHud() {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
            ctx.strokeRect(10, 10, 160, 100);
            ctx.fillStyle = "white";
            ctx.font = "bold 18px Arial";
            ctx.fillText("Score: " + score, 25, 38);
            ctx.fillStyle = "#f87171";
            ctx.fillText("Lives: " + "♥".repeat(lives), 25, 68);
            ctx.fillStyle = "#67e8f9";
            ctx.font = "14px Arial";
            ctx.fillText("Balls: " + balls.length, 25, 95);
        }

        function drawMessage(title, color, subtitle) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = color;
            ctx.font = "bold 48px Arial";
            ctx.textAlign = "center";
            ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 20);
            ctx.fillStyle = "white";
            ctx.font = "bold 24px Arial";
            ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 + 35);
            ctx.fillStyle = "#d1d5db";
            ctx.font = "18px Arial";
            ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 85);
            ctx.textAlign = "left";
        }

        function powerColor(type) {
            if (type === "wide") return "#22d3ee";
            if (type === "multi") return "#22c55e";
            if (type === "slow") return "#60a5fa";
            return "#ef4444";
        }

        function powerSymbol(type) {
            if (type === "wide") return "W";
            if (type === "multi") return "M";
            if (type === "slow") return "S";
            return "+";
        }

        function loop(now) {
            const deltaTime = Math.min((now - lastTime) / 1000, 0.03);
            lastTime = now;
            update(deltaTime);
            draw();
            requestAnimationFrame(loop);
        }

        canvas.addEventListener("mousemove", event => {
            const rect = canvas.getBoundingClientRect();
            const scale = canvas.width / rect.width;
            paddle.x = (event.clientX - rect.left) * scale - paddle.width / 2;
            usingMouse = true;
            keepPaddleInBounds();
        });

        window.addEventListener("keydown", event => {
            if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
                keys.left = true;
                usingMouse = false;
            }
            if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
                keys.right = true;
                usingMouse = false;
            }
            if (event.key.toLowerCase() === "r") {
                resetGame();
            }
        });

        window.addEventListener("keyup", event => {
            if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
                keys.left = false;
            }
            if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
                keys.right = false;
            }
        });

        restartButton.addEventListener("click", resetGame);

        resetGame();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
